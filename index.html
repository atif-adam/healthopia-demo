:root {
  --ink: #243f43;
  --muted: #63777a;
  --teal: #175c58;
  --teal-soft: #e7f2ee;
  --line: #dce5e4;
  --paper: #f5f8f8;
  --white: #fff;
  --red: #a54239;
  --red-soft: #fff0ed;
  --amber: #885f21;
  --amber-soft: #fcf4e4;
  --shadow: 0 12px 36px #284d4410;
  font-family:
    "DM Sans",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  font-size: 16px;
  color: var(--ink);
  background: var(--paper);
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button,
a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
  border: 0;
  background: none;
  color: inherit;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}
a {
  color: var(--teal);
  text-decoration: none;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #258b92;
  outline-offset: 3px;
}
button:hover:not(:disabled) {
  filter: brightness(0.97);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 1.65rem;
  letter-spacing: -0.04em;
  line-height: 1.2;
}
h2 {
  font-size: 1.12rem;
  letter-spacing: -0.025em;
  line-height: 1.35;
}
h3 {
  font-size: 1rem;
  line-height: 1.4;
}
p {
  line-height: 1.55;
}
small,
.meta {
  font-size: 0.78rem;
  color: var(--muted);
  line-height: 1.5;
}
.muted {
  color: var(--muted);
}
.eyebrow {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);

            version: instrument.version,
            respondent: instrument.respondent,

    actions.forEach((a) => {

        plots.push({
          id: a.plotId,
          name: a.plot?.name || a.title,
          place: a.place,
          existing: false,
        });
    });
    patients[id] = {
      ...s,
      id,
      record: c,
      people: people[id],
      evidence,
      daily,
      plots,
      actions,
      events: c.events.map((e, i) => ({
        id: "event-" + i,
        day: e[0],
        title: e[1],
        place: e[2],
      })),
    };
  }
  window.WORKSPACE_DATA = {
    patients,
    metrics,
    places: window.CITY_PLACES,
    catalogue: window.CLINICAL_CATALOGUE,
  };
})();

    <script>
/* Device-local fictional demonstration. No clinical integration or remote writes. */
(() => {
  const D = window.WORKSPACE_DATA,
    KEY = "healthopia-shared-workspace-v1",
    copy = (x) => JSON.parse(JSON.stringify(x));
  const fresh = (id) => ({
    selected: [D.patients[id].concerns[0].id],
    active: D.patients[id].concerns[0].id,
    place: D.patients[id].concerns[0].places[0],
    day: 0,
    weeks: 3,
    focusMetric: D.patients[id].concerns[0].trend || "restore",
    tab: "context",
    actions: copy(D.patients[id].actions),
    plots: copy(D.patients[id].plots),
    aim: D.patients[id].aim,
    clarifications: [],
    notes: "",
    sharedEvidence: [],
    urgentReview: null,
    dispositions: {},
    snapshot: null,
    receipt: false,
    response: false,
    version: 0,
    owner: D.patients[id].record.owner,
  });
  let saved = {};
  try {
    saved = JSON.parse(sessionStorage.getItem(KEY) || "{}");
  } catch {}
  const store = {};
  for (const id of Object.keys(D.patients))
    store[id] =
      saved[id]?.actions && Array.isArray(saved[id].selected)
        ? saved[id]
        : fresh(id);
  const persist = () => {
    try {
      sessionStorage.setItem(KEY, JSON.stringify(store));
      return true;
    } catch {
      return false;
    }
  };
  const get = (id) => store[id],
    current = (id, cid) =>
      D.patients[id].concerns.find((c) => c.id === (cid || get(id).active));
  function chooseConcern(id, cid, combine = false) {
    const s = get(id),
      c = current(id, cid);
    if (!c) return;
    if (combine) {
      if (s.selected.includes(cid) && s.selected.length > 1) {
        s.selected = s.selected.filter((x) => x !== cid);
        if (s.active === cid) s.active = s.selected[0];
      } else {
        if (!s.selected.includes(cid)) s.selected.push(cid);
        s.active = cid;
      }
    } else {
      s.selected = [cid];
      s.active = cid;
    }
    const a = current(id);
    s.place = a.places[0];
    if (a.trend) s.focusMetric = a.trend;
    s.tab = "context";
    persist();
  }
  function choosePlace(id, place) {
    if (!D.places.some((p) => p.id === place)) return;
    get(id).place = place;
    persist();
  }
  function priority(id) {
    const s = get(id);
    if (id === "maya" && !s.urgentReview) return "urgent";
    if (id === "maya" && !s.snapshot && !s.dispositions.cognition) return "due";
    if (s.snapshot && !s.receipt) return "due";
    if (
      s.response &&
      s.snapshot.actions.some((a) =>
        a.concerns.some((cid) => s.dispositions[cid]?.phase !== "followup"),
      )
    )
      return "due";
    if (id === "elena" && !s.snapshot && !s.dispositions.sleep) return "due";
    return "routine";
  }
  function evidence(id, { place = null, concern = true } = {}) {
    const s = get(id),
      p = D.patients[id],
      order = s.selected.flatMap((cid) => current(id, cid).evidence),
      refs = new Set(order),
      returned = [];
    if (s.response && s.day >= p.record.responseDay) {
      for (const a of p.record.assessments) {
        if (
          a.futureScore !== undefined &&
          s.snapshot?.actions.some(
            (x) => x.assessmentId === a.id && x.reviewDay <= s.day,
          )
        )
          returned.push({
            id: a.id + "-return",
            parentId: a.id,
            kind: "assessment",
            title: a.name + " · follow-up",
            short: a.short,
            value: `${a.futureScore}/${a.max}`,
            day: p.record.responseDay,
            source: "Scripted follow-up · " + a.respondent,
            text: "Fictional returned result. Compare with symptoms and function; the change does not establish an effect of the plan.",
            places: [a.place],
            audience: "clinical",
            assessment: {
              ...a,
              previous: a.score,
              score: a.futureScore,
              items: a.futureItems,
              priorItems: a.items,
              priorDay: a.day,
              day: p.record.responseDay,
            },
          });
      }
    }
    return [...returned, ...p.evidence, ...s.clarifications]
      .filter(
        (e) =>
          e.day <= s.day &&
          (!concern ||
            refs.has(e.id) ||
            refs.has(e.parentId) ||
            e.kind === "clarification") &&
          (!place || e.places.includes(place)),
      )
      .sort(
        (a, b) =>
          (order.indexOf(a.parentId || a.id) < 0
            ? 999
            : order.indexOf(a.parentId || a.id)) -
            (order.indexOf(b.parentId || b.id) < 0
              ? 999
              : order.indexOf(b.parentId || b.id)) || b.day - a.day,
      );
  }
  function addAction(id, action, plot) {
    const s = get(id);
    if (s.snapshot)
      throw Error("Start a revision before changing the delivered plan.");
    if (
      !action.title?.trim() ||
      !action.patientText?.trim() ||
      !action.reviewQuestion?.trim() ||
      !action.owner?.trim() ||
      !action.concerns?.length
    )
      throw Error(
        "Complete the activity, purpose, owner and clinical concern.",
      );
    if (
      !Number.isInteger(action.reviewDay) ||
      action.reviewDay < 1 ||
      action.reviewDay > 90
    )
      throw Error("Choose a review day from 1 to 90.");
    if (!action.concerns.every((cid) => current(id, cid)))
      throw Error("Choose a clinical concern for this patient.");
    const target =
      s.plots.find((p) => p.id === action.plotId) ||
      (plot?.id === action.plotId ? plot : null);
    if (
      !target ||
      !target.name?.trim() ||
      !D.places.some((p) => p.id === target.place) ||
      action.place !== target.place
    )
      throw Error("Choose an existing plot or name a new plot.");
    if (plot && !s.plots.some((p) => p.id === plot.id))
      s.plots.push(copy(plot));
    const i = s.actions.findIndex((a) => a.id === action.id);
    if (i >= 0) s.actions[i] = copy(action);
    else s.actions.push(copy(action));
    persist();
  }
  function setActionStatus(id, aid, status) {
    const s = get(id);
    if (s.snapshot) throw Error("Start a revision before editing this plan.");
    const a = s.actions.find((x) => x.id === aid);
    if (
      !a ||
      a.status === "completed" ||
      !["proposed", "agreed", "deferred", "declined"].includes(status)
    )
      return;
    a.status = status;
    persist();
  }
  function sign(id, reviewer, confirmed) {
    const s = get(id);
    if (id === "maya" && !s.urgentReview)
      throw Error(
        "Document the immediate clinical review before sending routine instructions.",
      );
    if (!confirmed || !reviewer?.trim())
      throw Error("Confirm the review and enter the responsible clinician.");
    const actions = s.actions.filter((a) => a.status === "agreed");
    if (!actions.length)
      throw Error("Agree at least one action before sending.");
    s.version += 1;
    s.snapshot = {
      version: s.version,
      reviewer,
      actions: copy(actions),
      plots: copy(s.plots),
      aim: s.aim,
      at: Date.now(),
    };
    s.receipt = false;
    s.response = false;
    persist();
  }
  function receive(id) {
    const s = get(id);
    if (!s.snapshot) throw Error("Review and sign the plan first.");
    s.receipt = true;
    persist();
  }
  function respond(id) {
    const s = get(id);
    if (!s.receipt)
      throw Error("Simulate app receipt before viewing a response.");
    s.response = true;
    s.day = D.patients[id].record.responseDay;
    s.tab = "followup";
    persist();
  }
  function revise(id) {
    const s = get(id);
    if (s.snapshot) {
      s.history = s.history || [];
      s.history.push(
        copy({
          snapshot: s.snapshot,
          receipt: s.receipt,
          response: s.response,
          dispositions: s.dispositions,
        }),
      );
    }
    s.snapshot = null;
    s.receipt = false;
    s.response = false;
    s.dispositions = {};
    s.day = 0;
    s.actions = s.actions.map((a) => ({
      ...a,
      status: a.status === "agreed" ? "proposed" : a.status,
    }));
    s.tab = "plan";
    persist();
  }
  function reset(id) {
    store[id] = fresh(id);
    persist();
  }
  function responseSummary(id) {
    const st = get(id),
      original = D.patients[id].actions,
      scripts = {
        "elena-sleep": [
          "The earlier call helps the routine fit. I still wake on some nights, but breakfast feels easier.",
          "Overnight interruptions continue on some nights.",
        ],
        "elena-walk": [
          "I managed five of six planned walks.",
          "Rain interrupted one walk; Elena prefers an indoor alternative.",
        ],
        "elena-check": [
          "I completed the sleep questionnaire and brought examples from breakfast.",
          "Clarify whether any further task interruptions occurred.",
        ],
        "maya-function": [
          "The agreed support is in place. We would like a written routine checklist.",
          "The care partner could not find the support instructions on first opening.",
        ],
        "maya-contact": [
          "We completed the care-team check-in and confirmed the next contact.",
          "Confirm who will contact the care partner if another change occurs.",
        ],
        "james-time": [
          "The breakfast reminder fits better.",
          "A shift changed at short notice; James wants to reschedule the reminder easily.",
        ],
        "james-ride": [
          "I kept the shared rides and used the shorter route twice during a busy week.",
          "Keep the shorter alternative available for busy weeks.",
        ],
        "james-check": [
          "I completed the mood questionnaire for our review.",
          "Discuss symptoms, function and whether the plan feels manageable.",
        ],
      };
    const matched = (st.snapshot?.actions || []).filter((a) => {
      const base = original.find((x) => x.id === a.id);
      return (
        scripts[a.id] &&
        a.reviewDay <= D.patients[id].record.responseDay &&
        base &&
        a.patientText === base.patientText &&
        a.title === base.title
      );
    });
    return {
      text:
        matched.map((a) => scripts[a.id][0]).join(" ") ||
        "No scripted narrative is supplied for these custom instructions. A patient response remains to be collected.",
      barriers: matched.map((a) => scripts[a.id][1]),
      custom: (st.snapshot?.actions || []).filter((a) => !matched.includes(a)),
      interpretation:
        id === "maya"
          ? "Review the immediate disposition and continuing support needs. The historical cognitive assessment does not describe recovery from this episode."
          : "Compare returned observations with the agreed review question and daily function. The demonstration does not establish that the plan caused a change.",
    };
  }
  function followupReviewed(id) {
    const st = get(id);
    return (
      !!st.response &&
      !!st.snapshot &&
      st.snapshot.actions.every((a) =>
        a.concerns.every((cid) => st.dispositions[cid]?.phase === "followup"),
      )
    );
  }
  window.WorkspaceModel = {
    get,
    all: store,
    copy,
    persist,
    current,
    chooseConcern,
    choosePlace,
    priority,
    evidence,
    addAction,
    setActionStatus,
    sign,
    receive,
    respond,
    revise,
    reset,
    responseSummary,
    followupReviewed,
  };
})();

          modal("Discuss support", `<p>Ask ${esc(p().name.split(' ')[0])} who they would like involved and what support would preserve independence.</p><p>Record the person's preferences and confirm the proposed role before adding it to the plan.</p>`, btn("Close","close")+btn("Discuss a support activity","journey-plan","primary")); break;

          $("patientJourney").scrollIntoView({behavior:"smooth",block:"start"}); break;
        case "journey-plan":
          actionForm("Activity", null, selectedJourney()?.id); break;
        case "journey-world":
          $("worldSurface").scrollIntoView({behavior:"smooth",block:"start"});
          break;
        case "world-current":
          previewWorld = false;
          render();
          break;

          previewWorld = true;
          s().day = 0;
          s().tab = "plan";
          M.persist();
          render();
          break;

          signalsOpen = !signalsOpen;
          render();

          previewWorld = !s().response;
          s().day = s().response ? p().record.responseDay : 0;
          s().tab = "followup";
          M.persist();
          render();
          break;
        case "guide":
          guide();
          break;
        case "close":
          closeModal();
          break;

        case "clarify":
        case "urgent":
        case "disposition":
          simpleForm(action);

          recordsDialog();

          evidenceDialog(t.dataset.evidence);
          break;
        case "add-action":
          actionForm();

          actionForm("Assessment");

        case "action-from-evidence":
          actionForm("Activity", null, t.dataset.evidence);
          break;
        case "assessment-from-evidence":
          actionForm("Assessment", null, t.dataset.evidence);
          break;
        case "handoff":
          handoff();
          break;
        case "app-preview":
          handoff(true);
          break;
        case "receive":
          M.receive(p().id);
          render();
          handoff(true);

        case "respond":
          previewWorld = false;
          M.respond(p().id);

          closeModal();

          modal(
            "Restart " + p().name.split(" ")[0] + "’s demonstration?",
            "<p>This clears this patient’s local demo edits and returns to the original fictional visit. The other patients are preserved.</p>",

          render();
          closeModal();
        }
        if (t.dataset.planPlace) {
          M.choosePlace(p().id, t.dataset.planPlace);
          render();
        }
        if (t.dataset.metric) {
          s().focusMetric = t.dataset.metric;
          M.persist();
          render();
        }
        if (t.dataset.journeyEvidence) {
          const item = p().evidence.find(e => e.id === t.dataset.journeyEvidence);
          previewWorld = false;
          const linked=p().concerns.filter(c=>c.evidence.includes(item.id));
          if(linked.length && !linked.some(c=>s().selected.includes(c.id))) M.chooseConcern(p().id, linked[0].id);
          s().journeyEvidence = item.id;
          s().day = item.day;
          if(item.places.length) s().place = item.places[0];
          s().tab = "evidence";
          M.persist(); render();
        }
        if (t.dataset.event) {
          s().journeyEvidence = null;
          previewWorld = false;
          const event = p().events.find((x) => x.id === t.dataset.event);
          s().day = event.day;
          s().place = event.place;
          s().tab = "context";
          M.persist();
          render();
        }
        if (t.dataset.recordTab) recordsDialog(t.dataset.recordTab);
        if (t.dataset.person) {
          const person = p().people.find((x) => x.name === t.dataset.person);
          modal(
            person.name,
            `<span class="tag">${esc(person.role)}</span><p style="margin-top:18px">${esc(person.note)}</p><small>Patient-approved fictional context · visit day</small>`,
            btn("Close", "close") +
              btn("Add support to plan", "add-action", "primary"),
          );
        }
        if (t.dataset.catalogue) {
          const a = D.catalogue.find((x) => x.id === t.dataset.catalogue),
            f = $("actionForm");
          formDraft.catalogueId = a.id;
          formDraft.title = a.name;
          formDraft.assessmentName = a.name;
          formDraft.assessmentSource = a.source;
          const code = /PHQ-9/.test(a.name)
            ? "phq"
            : /Insomnia Severity/.test(a.name)
              ? "isi"
              : /Montreal/.test(a.name)
                ? "moca"
                : /Functional Activities/.test(a.name)
                  ? "faq"
                  : null;
          formDraft.assessmentId = code;
          f.elements.title.value = a.name;
          f.elements.version.value = "";
          f.elements.respondent.value =
            a.group === "Care partner" || /FAQ|AD8|IQCODE|NPI-Q/.test(a.name)
              ? "Care partner"
              : a.group === "Cognition"
                ? "Clinician"
                : "Patient";
          renderCatalogue();
        }
      } catch (err) {
        error(err);
      }
    });
    document.addEventListener("change", (e) => {
    if(e.target.id === "journeyWindow") {
      s().journeyWindow = Number(e.target.value); M.persist(); render(); return;
    }
      if (e.target.id === "reviewDay") {
        M.persist();
        render();
      }
      if (e.target.id === "reviewWeeks") {
        s().weeks = Number(e.target.value);
        const end = s().response ? p().record.responseDay : 0;
        s().day = Math.max(s().day, end - s().weeks * 7 + 1);
        M.persist();
        render();
      }
      if (e.target.id === "shareEvidence") {
        const id = e.target.dataset.evidenceId;
        s().sharedEvidence = e.target.checked
          ? [...new Set([...s().sharedEvidence, id])]
          : s().sharedEvidence.filter((x) => x !== id);
        M.persist();
        render();
      }
      if (e.target.id === "catalogueGroup") renderCatalogue();
      if (e.target.id === "plotSelect") {
        const isNew = e.target.value === "__new";
        $("newPlotNameField").hidden = !isNew;
        $("newPlotPlaceField").hidden = !isNew;
        $("existingPlotNote").hidden = isNew;
        document.querySelector('[name="plotName"]').required = isNew;
      }
    });
    document.addEventListener("input", (e) => {
      if (e.target.id === "catalogueSearch") renderCatalogue();
      if (e.target.id === "reviewDay") {
        s().day = Number(e.target.value);
        const metric = D.metrics[s().focusMetric],
          value = p().daily[s().focusMetric][s().day + 83],
          hit = $("chartHit"),
          start = Number(hit.dataset.chartStart),
          end = Number(hit.dataset.chartEnd),
          x =
            40 +
            ((s().day - start) / (end - start)) *
              (Number(hit.dataset.chartWidth) - 54);
        $("dayCursor").setAttribute("x1", x);
        $("dayCursor").setAttribute("x2", x);
        $("chartReadout").innerHTML =
          `<span>${dayLabel(s().day)}</span><strong>${metric.name}: ${value ?? "No entry"} ${value == null ? "" : metric.unit}</strong>`;
      }
    });
    document.addEventListener("submit", (e) => {
      const form = e.target;
      if (!form.matches("form")) return;
      e.preventDefault();
      const f = new FormData(form);
      try {
        if (form.id === "actionForm") {
          const concerns = f.getAll("concerns");
          if (!concerns.length)
            throw Error("Select at least one clinical concern.");
          let plot = null,
            plotId = f.get("plotId");
          if (plotId === "__new") {
            const name = String(f.get("plotName")).trim();
            if (!name) throw Error("Name the new plot.");
            plot = {
              id: "plot-" + Date.now().toString(36),
              name,
              place: f.get("place"),
              existing: false,
            };
            plotId = plot.id;
          }
          const target = plot || s().plots.find((x) => x.id === plotId);
          const title = String(f.get("title")).trim(),
            assessment = formDraft.type === "Assessment";
          if (
            assessment &&
            title !== formDraft.title &&
            title !== formDraft.assessmentName
          ) {
            formDraft.assessmentId = null;
            formDraft.catalogueId = null;
            formDraft.assessmentSource = null;
          }
          const action = {
            ...formDraft,
            title,
            patientTitle: title,
            patientText: String(f.get("patientText")).trim(),
            text: String(f.get("patientText")).trim(),
            reviewQuestion: String(f.get("reviewQuestion")).trim(),
            owner: String(f.get("owner")).trim(),
            reviewDay: Number(f.get("reviewDay")),
            due: "Review on day +" + f.get("reviewDay"),
            concerns,
            plotId,
            place: target?.place,
            type: assessment ? "Assessment" : f.get("type"),
            status: "proposed",
            minutes: Number(f.get("minutes") || 0),
            version: assessment ? String(f.get("version")).trim() : null,
            respondent: assessment ? f.get("respondent") : null,
            assessmentName: assessment ? title : null,
          };
          M.addAction(p().id, action, plot);
          s().tab = "plan";
          s().place = action.place;
          s().focusAction = action.id;
          M.persist();
          render();
          closeModal();
          notify("Proposal added to the concern and the patient’s plot.");
        }
        if (form.id === "aimForm") {
          s().aim = String(f.get("aim")).trim();
          if (!s().aim) throw Error("Enter the patient’s priority.");
          M.persist();
          render();
          closeModal();
        }
        if (form.id === "clarifyForm") {
          const title = String(f.get("title")).trim(),
            text = String(f.get("text")).trim();
          if (!title || !text) throw Error("Enter a title and clarification.");
          s().clarifications.push({
            id: "clarification-" + Date.now().toString(36),
            kind: "clarification",
            title,
            text,
            source: f.get("source"),
            day: 0,
            places: [s().place],
            audience: "shared",
          });
          s().day = 0;
          s().tab = "context";
          M.persist();
          render();
          closeModal();
          notify("Clarification added; original reports are preserved.");
        }
        if (form.id === "urgentForm") {
          const summary = String(f.get("summary")).trim(),
            reviewer = String(f.get("reviewer")).trim(),
            next = String(f.get("next")).trim(),
            disposition = f.get("disposition");
          if (
            !summary ||
            !reviewer ||
            !next ||
            !disposition ||
            !f.get("confirmed")
          )
            throw Error(
              "Complete the current review, disposition and next contact.",
            );
          if (disposition === "Team contacted; urgent review remains open") {
            s().notes =
              (s().notes ? s().notes + "\n\n" : "") +
              "Urgent contact: " +
              summary +
              " · " +
              reviewer +
              " · " +
              next;
            notify("Contact documented. Urgent review remains open.");
          } else {
            s().urgentReview = { summary, reviewer, next, disposition };
            s().dispositions.acute = {
              decision: disposition,
              note: summary,
              owner: reviewer,
              next,
              phase: "visit",
            };
            const review = s().actions.find((a) => a.id === "maya-review");
            if (review) review.status = "completed";
            notify(
              "Immediate review documented; the cognitive episode remains open.",
            );
          }
          M.persist();
          render();
          closeModal();
        }
        if (form.id === "dispositionForm") {
          const note = String(f.get("note")).trim(),
            owner = String(f.get("owner")).trim(),
            next = String(f.get("next")).trim();
          if (!note || !owner || !next)
            throw Error("Record the reasoning, owner and next review.");
          s().dispositions[s().active] = {
            decision: f.get("decision"),
            note,
            owner,
            next,
            phase: s().response ? "followup" : "visit",
          };
          M.persist();
          render();
          closeModal();
          notify(
            "Clinical decision recorded for " + c().title.toLowerCase() + ".",
          );
        }
        if (form.id === "notesForm") {
          s().notes = String(f.get("note"));
          M.persist();
          notify("Working note saved in this tab.");
        }
        if (form.id === "assignForm") {
          const owner = String(f.get("owner")).trim();
          if (!owner) throw Error("Enter the responsible team member.");
          M.get(form.dataset.patient).owner = owner;
          M.persist();
          render();
          closeModal();
        }
        if (form.id === "signForm") {
          M.sign(
            p().id,
            String(f.get("reviewer")).trim(),
            !!f.get("confirmed"),
          );
          render();
          handoff(true);
          notify("Demo plan signed. App receipt is a separate step.");
        }
      } catch (err) {
        error(err);
      }
    });
    document.addEventListener("pointermove", (e) => {
      if (e.target.id !== "chartHit") return;
      const svg = $("dailyChart"),
        rect = svg.getBoundingClientRect(),
        start = Number(e.target.dataset.chartStart),
        end = Number(e.target.dataset.chartEnd),
        frac =
          (((e.clientX - rect.left) / rect.width) *
            Number(e.target.dataset.chartWidth) -
            40) /
          (Number(e.target.dataset.chartWidth) - 54),
        day = Math.max(
          start,
          Math.min(end, Math.round(start + frac * (end - start))),
        ),
        tip = $("chartTooltip");
      tip.hidden = false;
      tip.innerHTML =
        `<b>${dayLabel(day)}</b>` +
        Object.entries(D.metrics)
          .map(
            ([k, m]) =>
              `<div class="row"><span>${m.name}</span><strong>${p().daily[k][day + 83] ?? "—"} ${p().daily[k][day + 83] == null ? "" : m.unit}</strong></div>`,
          )
          .join("");
    });
    document.addEventListener("pointerout", (e) => {
      if (e.target.id === "chartHit" && $("chartTooltip"))
        $("chartTooltip").hidden = true;
    });
    document.addEventListener("click", (e) => {
      if (e.target.id === "chartHit") {
        const rect = $("dailyChart").getBoundingClientRect(),
          start = Number(e.target.dataset.chartStart),
          end = Number(e.target.dataset.chartEnd);
        s().day = Math.max(
          start,
          Math.min(
            end,
            Math.round(
              start +
                ((((e.clientX - rect.left) / rect.width) *
                  Number(e.target.dataset.chartWidth) -
                  40) /
                  (Number(e.target.dataset.chartWidth) - 54)) *
                  (end - start),
            ),
          ),
        );
        M.persist();
        render();
      }
    });
    $("workspaceDialog").addEventListener("close", () => {
      if (lastFocus?.isConnected) lastFocus.focus();
    });
    document.addEventListener("keydown", (e) => {
      if (
        e.target.getAttribute("role") === "tab" &&
        ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)
      ) {
        e.preventDefault();
        const tabs = [
            ...document.querySelectorAll('.drawer-tabs [role="tab"]'),
          ],
          i = tabs.indexOf(e.target),
          next =
            e.key === "Home"
              ? 0
              : e.key === "End"
                ? tabs.length - 1
                : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) %
                  tabs.length;
        tabs[next].click();
        document.getElementById(tabs[next].id)?.focus();
      }
    });
  }

  function tray() {
    const st = s(),
      agreed = st.actions.filter((a) => a.status === "agreed");
    return `<aside class="plan-tray" aria-label="Persistent shared plan"><div class="summary"><h2>${icon("check")} Shared plan</h2><p>${agreed.length} agreed · ${st.actions.filter((a) => a.status === "proposed").length} proposed · ${st.snapshot ? "Version " + st.version : "Draft saved in this tab"}</p></div><div class="mini-actions">${activePlanActions()
      .slice(0, 2)
      .map(
        (a) =>
          `<button data-plan-item="${a.id}" class="${a.status}">${esc(a.title)}</button>`,
      )
      .join(
        "",
      )}</div>${btn("Review plan", "plan", "")}${btn(st.snapshot ? "Patient app" : "Review & send", "handoff", "primary")}</aside>`;
  }
  function patientPage() {
    const st = s();
    return `<main id="main" class="main"><div class="patient-header"><span class="avatar ${p().id}">${p().initials}</span><div class="identity"><h1>${p().name}</h1><small>${p().age} years · ${p().role} · ${dayLabel(0)}</small></div><div class="patient-aim"><span class="eyebrow">What matters to ${p().name.split(" ")[0]}</span><p>${esc(st.aim)} <button aria-label="Edit patient priority" data-action="aim">${icon("edit")}</button></p></div><div class="header-actions"><div class="view-tools" aria-label="Presentation"><button data-mode="clinical" class="${route.mode === "clinical" ? "active" : ""}" aria-pressed="${route.mode === "clinical"}">Clinician</button><button data-mode="shared" class="${route.mode === "shared" ? "active" : ""}" aria-pressed="${route.mode === "shared"}">Review together</button></div>${btn(icon("file") + " Clinical record", "records", "small clinical-only")}</div></div>${route.mode === "shared" ? '<div class="shared-indicator">Reviewing the same concern and plan together · selected clinical details can be opened for discussion.</div>' : ""}${p().id === "maya" && !st.urgentReview ? `<div class="urgent-strip">${icon("alert")}<div class="grow"><strong>New disorientation · clinical review pending</strong><p>Current report and immediate needs take priority. ${esc(st.owner.split(" · ")[0])} owns this review.</p></div>${btn("Review current report", "urgent", "danger small")}</div>` : ""}<div class="concern-intro"><span class="eyebrow">Today’s clinical agenda</span><label class="combine-toggle"><input type="checkbox" id="combineConcerns" ${combine ? "checked" : ""}>Connect concerns</label></div><div class="concerns">${p()
      .concerns.map(
        (x) =>
          `<button class="concern ${st.selected.includes(x.id) ? "active" : ""}" data-concern="${x.id}" aria-pressed="${st.selected.includes(x.id)}"><span><strong>${x.title}</strong><small>${x.source} · visit snapshot</small></span><b>${signalFor(x)}</b></button>`,
      )
      .join(
        "",
      )}</div>${eventThread()}${selectionBar()}<div class="workspace-grid"><div class="world-column"><section class="world-surface" id="worldSurface">${world()}</section><section class="trends" id="trends" ${signalsOpen ? "" : "hidden"}>${trends()}</section></div><aside class="context-drawer" id="contextDrawer">${drawer()}</aside></div><footer class="page-foot">Shared conceptual city · fictional clinical records · no live Epic connection or patient delivery.</footer></main>${tray()}`;
  }
  function fitWorkspace() {
    if (!route.patient) return;
    if ($("trends"))
      $("trends").innerHTML = trends(
        Math.max(280, ($("trends").clientWidth || 734) - 34),
      );
    const svg = $("city");
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return;
    const scale = Math.min(rect.width / 885, rect.height / 555),
      compact = rect.width < 530;
    svg.querySelectorAll(".city-hit").forEach((g) => {
      const pl = D.places.find((x) => x.id === g.dataset.place),
        name = g.querySelector(".city-name"),
        caption = g.querySelector(".city-caption");
      name.style.fontSize = Math.max(18, 14 / scale) + "px";
      if (compact) name.textContent = pl.short;
      caption.style.fontSize = Math.max(14, 12 / scale) + "px";
      caption.style.display = compact ? "none" : "";
      const badge = g.querySelector(".plot-badge text");
      if (badge) {
        badge.style.fontSize = Math.max(14, 12 / scale) + "px";
        if (compact) badge.textContent = badge.textContent.trim().split(" ")[0];
      }
    });
  }
  function render() {
    const focused = document.activeElement?.id;
    $("app").innerHTML = shell(route.patient ? patientPage() : team());
    fitWorkspace();
    if (focused && $(focused)) $(focused).focus({ preventScroll: true });
  }
  document.addEventListener("click", (e) => {
    const nav = e.target.closest("[data-nav]");
    if (nav) {
      e.preventDefault();
      navigate(nav.dataset.nav === "team" ? null : nav.dataset.nav);
      return;
    }
    const t = e.target.closest("button,[data-place]");
    if (!t) return;
    if (t.dataset.filter) {
      filter = t.dataset.filter;
      render();
    } else if (t.dataset.concern) {
      s().journeyEvidence = null;
      M.chooseConcern(p().id, t.dataset.concern, combine);
      render();
    } else if (t.dataset.place) {
      M.choosePlace(p().id, t.dataset.place);
      s().tab = "context";
      render();
    } else if (t.dataset.tab) {
      s().tab = t.dataset.tab;
      M.persist();
      render();
    } else if (t.dataset.mode) {
      route.mode = t.dataset.mode;
      history.replaceState(
        {},
        "",
        `?patient=${p().id}${route.mode === "shared" ? "&mode=shared" : ""}`,
      );
      render();
    } else if (t.dataset.openTask) {
      const id = t.dataset.openTask,
        state = M.get(id);
      const nextConcern = state.response
        ? state.snapshot.actions
            .flatMap((a) => a.concerns)
            .find((cid) => state.dispositions[cid]?.phase !== "followup") ||
          state.active
        : id === "elena"
          ? "function"
          : D.patients[id].concerns[0].id;
      navigate(id, nextConcern);
      if (state.response) {
        state.tab = "followup";
        state.day = D.patients[id].record.responseDay;
        M.persist();
        render();
      }
    } else if (t.dataset.action === "plan" || t.dataset.planItem) {
      s().tab = "plan";
      if (t.dataset.planItem) {
        const a = s().actions.find((a) => a.id === t.dataset.planItem);
        s().focusAction = a.id;
        s().place = a.place;
      }
      M.persist();
      render();
    } else if (t.dataset.action === "today") {
      previewWorld = false;
      s().journeyEvidence = null;
      s().day = 0;
      M.persist();
      render();
    }
  });
  document.addEventListener("change", (e) => {
    if(e.target.id === "journeyWindow") {
      s().journeyWindow = Number(e.target.value); M.persist(); render(); return;
    }
    if (e.target.id === "combineConcerns") combine = e.target.checked;
    if (e.target.id === "connectionsToggle") {
      showConnections = e.target.checked;
      render();
    }
    if (e.target.id === "peopleToggle") {
      showPeople = e.target.checked;
      render();
    }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "patientSearch") {
      const a = e.target.selectionStart;
      search = e.target.value;
      render();
      $("patientSearch").focus();
      try {
        $("patientSearch").setSelectionRange(a, a);
      } catch {}
    }
  });
  document.addEventListener("keydown", (e) => {
    if (
      (e.key === "Enter" || e.key === " ") &&
      e.target.matches("g[data-place],g[data-person]")
    ) {
      e.preventDefault();
      e.target.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    }
  });
  window.addEventListener("resize", () => {
    clearTimeout(render.resizeTimer);
    render.resizeTimer = setTimeout(render, 100);
  });
  window.addEventListener("popstate", () => {
    readRoute();
    render();
  });
  bindExtra();
  readRoute();
  const sceneParam=new URLSearchParams(location.search).get('scene');
  const sceneLinks={elena:['breakfast','function-report','function'],james:['reminder','context-quiet','routine'],maya:['current','acute-report','acute']};
  const sceneLink=sceneLinks[route.patient];
  const openScene=sceneLink && sceneLink[0]===sceneParam;
  if(openScene) {
    M.chooseConcern(route.patient,sceneLink[2]); const e=p().evidence.find(e=>e.id===sceneLink[1]);
    s().journeyEvidence=e.id; s().day=e.day; s().place=e.places[0]; s().tab='evidence'; M.persist();
  }
  render();
  if(openScene) requestAnimationFrame(()=>$("worldSurface")?.scrollIntoView({block:'start'}));
  window.HealthopiaWorkspace = {
    render,
    navigate,
    model: M,
    data: D,
    get route() {
      return route;
    },
  };
})();

</script>
  </body>
</html>
